[package]
name = "shirl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Core logic for the Shirl coding assistant."

[dependencies]
sweet-core = { workspace = true, features = ["derive"] }
sweet-agent = { workspace = true }
sweet-session = { workspace = true, features = ["sqlite"] }
sweet-memory = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
sweet-agent = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }
