[package]
name = "shirl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Coding-assistant CLI built on Sweet."

[[bin]]
name = "shirl"
path = "src/main.rs"

[dependencies]
shirl-core = { path = "../shirl-core" }
shirl-llm = { path = "../shirl-llm" }
shirl-ui = { path = "../shirl-ui" }
shirl-agents = { path = "../shirl-agents" }
shirl-tools = { path = "../shirl-tools" }
sweet-agent = { workspace = true }
sweet-core = { workspace = true }
sweet-sandbox = { workspace = true }
sweet-tools = { workspace = true, features = ["http-fetch", "time", "tavily", "brave"] }
sweet-mcp = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "process", "fs"] }
anyhow = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
crossterm = { workspace = true }
ignore = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
sweet-agent = { workspace = true, features = ["test-util"] }
