[package]
name = "shirl-agents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Agent definitions, prompts, and tool wiring for the Shirl coding assistant."

[dependencies]
sweet-agent = { workspace = true }
sweet-core = { workspace = true, features = ["derive"] }
sweet-memory = { workspace = true }
sweet-tools = { workspace = true, default-features = false, features = ["calculator", "http-fetch", "web-search"] }
shirl-tools = { path = "../shirl-tools" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sweet-agent = { workspace = true, features = ["test-util"] }
